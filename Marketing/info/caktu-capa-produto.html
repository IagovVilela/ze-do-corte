<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px;
    height: 250px;
    overflow: hidden;
    font-family: Montserrat, "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(145deg, #0b0e15 0%, #10131a 45%, #1a2744 100%);
    color: #e1e2ec;
    position: relative;
  }
  .glow {
    position: absolute;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,.35), transparent 70%);
    top: -40px; right: -30px;
  }
  .inner {
    position: relative;
    z-index: 1;
    padding: 18px 16px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .brand {
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #C5A059;
    font-weight: 700;
  }
  h1 {
    margin-top: 10px;
    font-size: 26px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #fff;
  }
  p {
    margin-top: 8px;
    font-size: 11px;
    line-height: 1.35;
    color: #9CA3AF;
    max-width: 240px;
  }
  .price {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #3B82F6;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 6px;
    width: fit-content;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="inner">
    <div class="brand">Barbernegon · Guia prático</div>
    <h1>Vaga<br/>Perdida</h1>
    <p>Descubra quanto horário vazio está tirando do seu caixa.</p>
    <div class="price">R$ 19,90</div>
  </div>
</body>
</html>
